<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta Secreta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #ffe8f0, #f8cbdc);
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .tela-senha {
      background: rgba(255, 255, 255, 0.9);
      padding: 35px 25px;
      border-radius: 25px;
      box-shadow: 0 10px 35px rgba(130, 50, 90, 0.2);
    }

    h1 {
      color: #7d2852;
      font-size: 28px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #e5a2bd;
      border-radius: 12px;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #c94f83;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #c94f83;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ad3c6d;
    }

    .erro {
      min-height: 25px;
      margin-top: 15px;
      color: #c62828;
      font-weight: bold;
    }

    .carta {
      display: none;
      animation: aparecer 1s ease;
    }

    .carta img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(130, 50, 90, 0.3);
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
  </style>
</head>

    </div>
